name: Verify dist before deploy

on:
  push:
    branches: [ master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist exists
        run: |
          if [ ! -d "dist" ]; then
            echo "dist/ not found after build" >&2
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "dist/index.html missing" >&2
            exit 1
          fi
          # Ensure index.html references an assets/ file with a hash
          if ! grep -q "/assets/" dist/index.html; then
            echo "dist/index.html does not reference /assets/ files" >&2
            exit 1
          fi
          echo "dist verification passed"

      - name: Smoke test dist/index.html
        run: |
          # Basic HTML smoke tests: ensure root element and a script tag referencing assets exist
          if ! grep -q "<div[^>]*id=\"root\"" dist/index.html; then
            echo "dist/index.html does not contain a root element with id=\"root\"" >&2
            exit 1
          fi
          if ! grep -q "<script[^>]*src=\"/assets/\|/src/main" dist/index.html; then
            # If neither a built asset script nor a dev src script is present, fail
            if ! grep -q "<script" dist/index.html; then
              echo "dist/index.html does not contain a script tag" >&2
              exit 1
            fi
          fi
          echo "Smoke test passed: root element and script tag present"
