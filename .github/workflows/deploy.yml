name: Deploy to GitHub Pages

# This workflow runs after the `Verify dist before deploy` workflow completes
# (so deploy only happens when verify-dist passes). Manual dispatch is still
# supported via workflow_dispatch.
on:
  workflow_run:
    workflows: ["Verify dist before deploy"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Only proceed when the triggering workflow concluded successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified dist artifact
        uses: actions/download-artifact@v3
        with:
          name: verified-dist
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4