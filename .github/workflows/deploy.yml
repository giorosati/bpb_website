        with:
          name: verified-dist
          path: ./dist
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Check for downloaded dist
        run: |
          if [ -f "dist/index.html" ]; then
            echo "Found downloaded artifact"
            exit 0
          fi
          echo "No artifact downloaded"
          exit 0

      - name: Debug downloaded files
        if: ${{ always() }}
        run: |
          echo "download.outcome=${{ steps.download.outcome }}"
          ls -la ./dist || true
          ls -la ./dist/assets || true

      - name: Build fallback if artifact missing
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && steps.download.outcome != 'success') }}
        run: |
          echo "Artifact missing; building locally as fallback"
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
