  build:
    # Proceed when the triggering workflow concluded successfully OR when
    # manually dispatched. Manual dispatch doesn't set github.event.workflow_run
    # so the previous condition caused the job to be skipped on workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
