name: Deploy to GitHub Pages

# This workflow runs after the `Verify dist before deploy` workflow completes
# (so deploy only happens when verify-dist passes). Manual dispatch is still
# supported via workflow_dispatch.
on:
  workflow_run:
    workflows: ["Verify dist before deploy"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Only proceed when the triggering workflow concluded successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified dist artifact
        id: download
        # Update to v4 to prevent automatic failure on deprecated action versions
        uses: actions/download-artifact@v4
        with:
          name: verified-dist
          path: ./dist
        continue-on-error: true
      - name: Check for downloaded dist
        run: |
          if [ -f "dist/index.html" ]; then
            echo "Found downloaded artifact"
            exit 0
          fi
          echo "No artifact downloaded"
          exit 0

      - name: Build fallback if artifact missing
        if: ${{ steps.download.outcome != 'success' }}
        run: |
          echo "Artifact missing; building locally as fallback"
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4